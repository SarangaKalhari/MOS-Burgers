<div class="fixed inset-0 backdrop-blur-sm bg-black/30 flex justify-center items-center z-50">

  <div class="bg-white w-96 rounded-2xl shadow-xl p-6 animate-scale">

    <h2 class="text-xl font-bold mb-4 text-center">
      Payment Bill
    </h2>

    <div class="h-72 overflow-y-auto">
      @for(item of cartItems; track item.id){
        <div class="flex justify-between border-b py-2">
          <div>
            <p class="font-semibold">{{ item.title }}</p>
            <p class="text-sm text-gray-500">
              {{ item.qty }} × Rs {{ item.price }}
            </p>
          </div>
          <p class="font-semibold">
            Rs {{ item.qty * item.price }}
          </p>
        </div>
      }
    </div>

    <div class="flex justify-between mt-4 font-bold text-lg">
      <span>Total</span>
      <span>Rs {{ total }}</span>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button (click)="close()" class="bg-gray-400 text-white px-4 py-2 rounded">
        Close
      </button>

      <button (click)="printBill()" class="bg-green-500 text-white px-4 py-2 rounded">
        Print Bill
      </button>
    </div>

  </div>
</div>
