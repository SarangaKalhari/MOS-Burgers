<div class="bg-white rounded-2xl shadow-sm border border-gray-100">

    <!-- Header -->
    <div class="flex items-center justify-between p-4 md:p-6 border-b bg-gray-50 border-gray-100">
        <h2 class="text-lg font-semibold text-gray-800">Items</h2>

        <button 
          
          class="px-4 py-2 bg-blue-500 text-white text-sm rounded-lg hover:bg-blue-600 transition">
          + Add Item
        </button>
    </div>

    <!-- Table Wrapper (responsive) -->
    <div class="overflow-x-auto">

        <table class="min-w-full">

            <!-- Header -->
            <thead class="bg-gray-50 sticky top-0 z-10">
                <tr class="text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    <th class="px-6 py-3 text-left">Item</th>
                    <th class="px-6 py-3 text-left">Title</th>
                    <th class="px-6 py-3 text-left">Status</th>
                    <th class="px-6 py-3 text-left">Stock</th>
                    <th class="px-6 py-3 text-left">Unit Price</th>
                    <th class="px-6 py-3 text-right">Actions</th>
                </tr>
            </thead>

            <!-- Body -->
            <tbody class="divide-y divide-gray-100">

                @for(item of allItems; track item){

                <tr class="hover:bg-gray-50 transition duration-200">

                    <!-- Item -->
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center gap-3">
                            <img class="h-10 w-10 rounded-lg object-cover" [src]="item.image" />
                            <div>
                                <p class="text-sm font-semibold text-gray-900">
                                    {{ item.code }}
                                </p>
                            </div>
                        </div>
                    </td>

                    <!-- Title -->
                    <td class="px-6 py-4 text-sm font-medium text-gray-700">
                        {{ item.title }}
                    </td>

                    <!-- Status -->
                    <td class="px-6 py-4">
                        <span 
                          class="px-3 py-1 text-xs font-semibold rounded-full"
                          [ngClass]="{
                            'bg-green-100 text-green-700': item.status === 'Available',
                            'bg-yellow-100 text-yellow-700': item.status === 'Low',
                            'bg-red-100 text-red-700': item.status === 'UnAvailable'
                          }"
                        >
                            {{ item.status }}
                        </span>
                    </td>

                    <!-- Stock -->
                    <td class="px-6 py-4 text-sm text-gray-600 font-medium">
                        {{ item.stock }}
                    </td>

                    <!-- Price -->
                    <td class="px-6 py-4 text-sm text-gray-700 font-semibold">
                        Rs. {{ item.price | number:'1.2-2' }}
                    </td>

                    <!-- Actions -->
                    <td class="px-6 py-4 text-right">
                        <div class="flex justify-end gap-2">

                            <button 
                              class="px-3 py-1 text-xs rounded-md bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition">
                              Edit
                            </button>

                            <button 
                              class="px-3 py-1 text-xs rounded-md bg-red-50 text-red-600 hover:bg-red-100 transition">
                              Delete
                            </button>

                        </div>
                    </td>

                </tr>

                }

            </tbody>

        </table>

    </div>

</div>
