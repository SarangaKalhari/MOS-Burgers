<div class="w-full p-4"> 
  <div class="w-full">
    
    <div class="flex flex-wrap items-center gap-3 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      
      <div class="relative grow md:max-w-xs">
        <input type="text" [(ngModel)]="searchQuery" placeholder="Search items..." 
               class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all text-sm">
        <div class="absolute left-3 top-3 text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      @for (filter of filters; track filter.name) {
        <div class="relative w-full md:w-auto">
          <button (click)="toggleDropdown(filter.name)"
                  class="flex justify-between items-center w-full md:w-48 px-4 py-2.5 text-sm font-semibold text-gray-600 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 focus:ring-2 focus:ring-cyan-100 transition-all">
            <span>{{ filter.selectedLabel || filter.label }}</span>
            <svg class="w-4 h-4 ml-2 text-gray-400 transition-transform" [class.rotate-180]="activeDropdown === filter.name" viewBox="0 0 20 20" fill="currentColor">
              <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
            </svg>
          </button>

          @if (activeDropdown === filter.name) {
            <div class="absolute z-20 w-64 mt-2 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden animate-in fade-in zoom-in duration-200">
              <div class="max-h-60 overflow-y-auto p-2">
                @for (item of filter.items; track item.value) {
                  <div (click)="selectSingleItem(filter.name, item)"
                       class="flex items-center px-4 py-3 text-sm text-gray-700 hover:bg-cyan-50 rounded-xl cursor-pointer transition-colors"
                       [class.bg-cyan-50]="filter.selectedValue === item.value">
                    
                    <div class="w-4 h-4 rounded-full border border-gray-300 mr-3 flex items-center justify-center"
                         [class.border-cyan-600]="filter.selectedValue === item.value">
                      <div class="w-2 h-2 rounded-full bg-cyan-600" *ngIf="filter.selectedValue === item.value"></div>
                    </div>

                    <span [class.text-cyan-700]="filter.selectedValue === item.value" class="font-medium">{{ item.label }}</span>
                  </div>
                }
              </div>
            </div>
          }
        </div>
      }

      <div class="flex items-center gap-2 ml-auto">
        <button (click)="applyFilters()"
                class="px-8 py-2.5 bg-cyan-600 text-white text-sm font-bold rounded-xl hover:bg-cyan-700 transition-all shadow-md shadow-cyan-100">
          Apply
        </button>
      </div>
    </div>

    <div class="flex flex-wrap gap-2 px-2">
      @for (chip of allSelected; track chip.value) {
        <span class="inline-flex items-center px-4 py-1.5 rounded-full text-xs font-bold bg-white text-cyan-700 border border-cyan-100 shadow-sm">
          {{ chip.label }}
          <button (click)="removeChip(chip.filterName)" class="ml-2 hover:text-red-500 transition-colors">
            <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" />
            </svg>
          </button>
        </span>
      }
    </div>

  </div>
</div>
